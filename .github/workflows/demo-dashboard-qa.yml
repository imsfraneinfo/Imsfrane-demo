name: Demo Dashboard QA
on:
  push:
    branches: [gh-pages]
    paths:
      - members.html
      - navigation-pro.js
      - booking-pro.js
      - js/ims-favorites-demo.js
      - js/member-notifications.js
      - css/member-notifications.css
      - dashboard-pro.js
      - dashboard-pro.css
      - css/ims-favorites-pro.css
      - .github/workflows/demo-dashboard-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check navigation-pro.js
          node --check dashboard-pro.js
          node --check booking-pro.js
          node --check js/ims-favorites-demo.js
          node --check js/member-notifications.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('members.html').read_text()
          block=re.search(r'<script type="module">([\s\S]*?)</script>',page)
          assert block, 'member module script missing'
          Path('/tmp/imsfrane-members.mjs').write_text(block.group(1))
          PY
          node --check /tmp/imsfrane-members.mjs
      - name: Verify dashboard routes, assets, and account controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('members.html').read_text()
          for label in ['imsDashUi','imsSettingsPanel','imsDashMobileNav','profileForm','memberPhone','memberAvatarFile','imsDashOrders','preferencesForm','dashboard-pro.css','dashboard-pro.js','ims:member-profile','ims:member-session']:
              assert label in s,label
          for l in ('fr','en','ar','es'):
              for name in ('index','booking','rafting','randonnee','camping','vtt','quad','hebergement','blog','contact'):
                  assert Path(l,name+'.html').is_file(),(l,name)
                  if name in ('index','rafting','camping','randonnee','vtt','quad','hebergement'):
                      assert 'navigation-pro.js' in Path(l,name+'.html').read_text(),('missing member/favorites shell',l,name)
          for p in ('images/logo.webp','images/rafting-new/IMG_2089.webp','images/camping-1.webp','images/vtt.webp','images/quad.webp','images/hero.webp','images/21.webp'):
              assert Path(p).is_file(),p
          assert 'member_orders' in Path('booking-pro.js').read_text()
          assert 'member_favorites' in Path('js/ims-favorites-demo.js').read_text()
          assert 'member_favorites' in Path('dashboard-pro.js').read_text()
          assert 'member-notifications.js' in s
          assert 'member-notifications.js' in Path('navigation-pro.js').read_text()
          script=Path('js/member-notifications.js').read_text()
          assert 'send_member_announcement' in script
          assert 'p_preview_only:true' in script, 'Staging must only send preview to admin'
          assert 'member_notifications' in script and 'read_at' in script
          assert 'member_admins' in script
          assert 'member_notification_preferences' in s
          assert Path('css/member-notifications.css').is_file()
          print('PASS: Demo notification inbox and admin-only preview broadcasting')
          assert 'home-pro.css' in s and 'class="hp-home ims-dash-home-visual"' in s
          js=Path('dashboard-pro.js').read_text()
          assert 'new DOMParser()' in js and 'originalFavoriteCard' in js and 'sourceHomepage' in js
          import re
          for l in ('fr','en','ar','es'):
              html=Path(l,'index.html').read_text()
              for slug in ('rafting','randonnee','camping','vtt','quad','hebergement','tubing','jetski','4x4','passage','zrkan','anergui','almou','ahidous'):
                  match=re.search(r'<article class="hp-activity-card hp-'+slug+r'".*?</article>',html,re.S)
                  assert match,('homepage card missing',l,slug)
                  photo=re.search(r'<img[^>]*src="([^"]+)"',match.group(0))
                  assert photo,('homepage card image missing',l,slug)
                  local=Path(l,photo.group(1))
                  assert local.resolve().is_file(),('original card photo missing',l,slug,photo.group(1))
          print('PASS: Favorites mirror original homepage activity cards, photos, content and styling')
          all_activities=["rafting","randonnee","camping","vtt","quad","hebergement","tubing","jetski","4x4","passage","zrkan","anergui","almou","ahidous"]
          from pathlib import Path
          assert 'css/ims-favorites-pro.css' in s
          heart_css=Path('css/ims-favorites-pro.css').read_text()
          assert 'ims-heart-svg' in heart_css and 'aria-pressed' in heart_css
          both=[Path('js/ims-favorites-demo.js').read_text(),js]
          for slug in all_activities:
              assert all(('"'+slug+'"') in script for script in both),('Favorite catalog mismatch',slug)
          assert 'hp-activity-card' in both[0] and 'ims-original-fav-heart' in both[1]
          print('PASS: All 14 activities have Pro SVG hearts, Supabase favorite keys and card parity')


          print('PASS: Four-language dashboard, profile uploads, booking requests and synced favorites')
          PY
