name: Demo Journal and Notifications QA
on:
  push:
    branches: [gh-pages]
    paths:
      - '*/blog.html'
      - '*/blog-guide-*.html'
      - js/member-notifications-demo.js
      - css/member-notifications-demo.css
      - navigation-pro.js
      - members.html
      - .github/workflows/demo-journal-notifications-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check js/member-notifications-demo.js
          node --check navigation-pro.js
      - name: Check six multilingual guides and notification wiring
        run: |
          python3 - <<'PY'
          import re,html
          from pathlib import Path
          langs=['fr','en','ar','es']
          slugs=['rafting-season','imsfrane-summit','ahansal-gorges-walk','wild-camping','vtt-imsfrane','access-imsfrane']
          roots=Path('.')
          for lang in langs:
              page=(roots/lang/'blog.html').read_text()
              cards=re.findall(r'<article class="journal-card"[\s\S]*?</article>',page)
              assert len(cards)==6,(lang,'expected exactly 6 cards',len(cards))
              found=set()
              images=set()
              for card in cards:
                  match=re.search(r'href="(blog-guide-([a-z-]+)\.html)"',card)
                  assert match,(lang,'card link missing')
                  slug=match.group(2)
                  assert slug in slugs,(lang,'unwanted article',slug)
                  found.add(slug)
                  picture=re.search(r'<img[^>]+src="([^"]+)"',card)
                  assert picture,(lang,'card image missing',slug)
                  image_path=picture.group(1)
                  if image_path.startswith('/Imsfrane-demo/'):
                      image=roots/image_path.replace('/Imsfrane-demo/','',1)
                  else:
                      image=(roots/lang/image_path)
                  assert image.is_file(),(lang,'image missing',image_path)
                  assert image_path not in images,(lang,'duplicate featured card image',image_path)
                  images.add(image_path)
              assert found==set(slugs),(lang,found)
              # All locale versions use the same six audited original photos.
              expected={'rafting-season':'raft2.webp','imsfrane-summit':'randonnee-sommet.webp','ahansal-gorges-walk':'blog-gorges.webp','wild-camping':'camping-1.webp','vtt-imsfrane':'IMG_9763.webp','access-imsfrane':'hero.webp'}
              for slug,filename in expected.items():
                  card=next(x for x in cards if 'blog-guide-'+slug+'.html' in x)
                  assert '../images/'+filename in card,(lang,slug,'unexpected cover photo')
                  article=roots/lang/('blog-guide-'+slug+'.html')
                  assert ('../images/'+filename) in article.read_text(),(lang,slug,'unexpected article hero photo')
              framing=(roots/'navigation-pro.css').read_text()
              assert 'IMSFRANE JOURNAL FOCAL FRAMING' in framing
              for filename in list(expected.values())+['IMG_5131.webp']:
                  assert filename in framing,(filename,'framing rule missing')
              assert 'grid-template-rows:auto auto!important' in framing,'Photo and caption must stack on mobile'
              assert 'journal-card-image[href*="blog-guide-access-imsfrane"]' in framing
              for slug in slugs:
                  article=roots/lang/('blog-guide-'+slug+'.html')
                  source=article.read_text()
                  body=re.search(r'<article class="article-body">([\s\S]*?)</article>',source)
                  assert body,(lang,slug,'missing body')
                  text=re.sub(r'<[^>]+>',' ',body.group(1))
                  length=len(text.split())
                  assert length>=340,(lang,slug,'short article',length)
                  assert body.group(1).count('<section id="guide-')==7,(lang,slug,'no sections')
                  assert 'class="article-toc"' in body.group(1),(lang,slug,'no table of contents')
                  assert 'dateModified' in source and 'wordCount' in source,(lang,slug,'missing structured data')
          script=(roots/'js/member-notifications-demo.js').read_text()
          members=(roots/'members.html').read_text()
          nav=(roots/'navigation-pro.js').read_text()
          assert 'p_preview_only:true' in script,'DEMO must never send mass announcements'
          assert 'send_member_announcement' in script
          assert 'member-notifications.js' in members, 'Private account inbox must remain accessible'
          assert 'member-notifications-demo.js' not in members, 'No duplicate member notification UI'
          assert 'member-notifications-demo.js' not in nav and 'function loadMemberNotifications()' not in nav, 'Public header has no bell'
          assert 'p_preview_only:true' in (roots/'js/member-notifications.js').read_text(), 'Account announcements remain preview only'
          print('PASS: 6 meaningful guides in 4 languages, distinct photos, inbox and safe previews')
          PY
