name: Visual verify Arabic Demo
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Imsfrane demo"]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - qa_arabic_browser.py
      - qa_arabic_mobile_layout.py
      - qa_four_languages_browser.py
      - qa_rafting_article.py
      - .github/workflows/qa-arabic-browser.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # A real Chrome suite covers AR fonts, mobile RTL and four-language parity.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare actual browser
        run: |
          python3 -m pip install --quiet selenium
          echo "Chrome location:"
          command -v google-chrome || command -v chromium || true
          google-chrome --version || chromium --version || true
      - name: Verify published Arabic RTL fonts in Chrome on mobile and desktop
        run: python3 qa_arabic_browser.py
      - name: Check FR EN AR ES runtime and original layout in actual Chrome
        run: python3 qa_four_languages_browser.py
      - name: Diagnose Arabic mobile horizontal page movement
        run: python3 qa_arabic_mobile_layout.py
      - name: Verify illustrated expedition article and complete photographs
        run: python3 qa_rafting_article.py
      - name: Keep screenshots and text metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-mobile-desktop-screenshots
          path: |
            arabic-browser-diagnostics/
            arabic-layout-debug/
            four-language-browser-diagnostics/
          if-no-files-found: ignore
