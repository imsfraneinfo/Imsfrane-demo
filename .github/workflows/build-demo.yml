                "AVANT DE CHOISIR UNE DATE": "BEFORE CHOOSING A DATE",
                "HAUT ATLAS · OUED AHANSAL · MAROC": "HIGH ATLAS · OUED AHANSAL · MOROCCO",
                "EXPÉRIENCES AUTHENTIQUES": "AUTHENTIC EXPERIENCES",
                "IM SFRANE · AZILAL · MAROC": "IMSFRANE · AZILAL · MOROCCO",
                "Expériences": "Experiences",
                "De rivière": "Of river",
                "À partir de / pers.": "From / person",
                "Explorer les parcours": "Explore routes",
                "Voir les photos": "View photos",
                "Aventures nature dans l’Atlas": "Nature adventures in the Atlas",
                "Accueil": "Home",
                "Nos parcours": "Our routes",
                "Saison": "Season",
                "Expédition": "Expedition",
                "Galerie": "Gallery",
                "Juillet parfois possible": "July sometimes possible",
                "Départs uniquement après confirmation des conditions de la rivière": "Departures only after river conditions are confirmed",
                "SAISON HABITUELLE : MARS → JUIN": "TYPICAL SEASON: MARCH → JUNE",
                "Plus qu'une descente : des eaux vives, de grands paysages et cette sensation de liberté qu'on n'oublie pas. Une aventure accompagnée par notre équipe locale, au cœur de l'Atlas.": "More than a rafting trip: whitewater, spectacular landscapes and an unforgettable feeling of freedom. An adventure guided by our local team in the heart of the Atlas Mountains.",
