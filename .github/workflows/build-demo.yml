                "Arrivée à Tilouguite et retour": "Arrival in Tilouguite and return",
                "EXPÉDITION": "EXPEDITION",
                "PARCOURS 03 · 2 JOURS": "ROUTE 03 · 2 DAYS",
                "La grande": "The great",
                "expédition": "expedition",
                "Deux jours entre rivière, bivouac mobile, repas traditionnels et découverte du patrimoine amazigh.": "Two days of rafting, riverside camping, traditional meals and Amazigh heritage.",
                "Environ 50 km": "About 50 km",
                "2 jours": "2 days",
                "Bivouac": "Camping",
                "Voir les deux destinations": "See both destinations",
                "Pont Sidi Youssef : 2 500 DH / personne": "Sidi Youssef Bridge: 2,500 MAD / person",
                "Bin El Ouidane : 3 000 DH / personne": "Bin El Ouidane: 3,000 MAD / person",
                "Repas, bivouac et découvertes selon le programme": "Meals, camping and cultural visits according to the program",
                "À partir de": "From",
                "Découvrir l'expédition": "Explore the expedition",
                "ÉMOTIONS SUR L’EAU": "THRILLS ON THE WATER",
                "Un instant dans les rapides, le suivant face à un paysage silencieux : chaque descente a son caractère.": "One moment in the rapids, the next surrounded by peaceful scenery: every descent has its own character.",
                "L'EXPÉRIENCE SIGNATURE": "OUR SIGNATURE EXPERIENCE",
                "Une véritable immersion le long de l'Oued Ahansal, avec une nuit en bivouac, des repas locaux et des rencontres avec le patrimoine de la région.": "An immersive journey along the Ahansal River, with a night camping, local meals and opportunities to discover regional heritage.",
                "Deux possibilités de fin de parcours : au Pont Sidi Youssef ou en poursuivant jusqu'au lac de Bin El Ouidane.": "Two possible endpoints: Sidi Youssef Bridge or continuing to Bin El Ouidane Lake.",
                "Jour 01 — En route vers l'aventure": "Day 01 — The adventure begins",
                "Accueil, transfert 4×4, équipement et briefing": "Welcome, 4×4 transfer, equipment and briefing",
                "Descente de rafting depuis Amougr": "Rafting descent from Amougr",
                "Déjeuner et temps de repos à Ighrman": "Lunch and rest stop in Ighrman",
                "Découverte d'Aït Hssine et visite d'une huilerie traditionnelle": "Visit Aït Hssine and a traditional oil mill",
                "Dîner, feu de camp et nuit en bivouac": "Dinner, campfire and overnight camping",
                "Jour 02 — Au cœur des gorges": "Day 02 — Into the gorges",
                "Petit-déjeuner et nouvelle mise à l'eau": "Breakfast and return to the water",
                "Navigation en direction du Pont Sidi Youssef": "Rafting toward Sidi Youssef Bridge",
                "Fin de l'expédition ou prolongation vers Bin El Ouidane": "Finish the expedition or continue toward Bin El Ouidane",
                "Dans l'option lac : bateau, déjeuner et retour": "Lake option: boat, lunch and return",
                "OPTION A · SIDI YOUSSEF": "OPTION A · SIDI YOUSSEF",
                "Par personne · Fin au pont et retour en 4×4": "Per person · Finish at the bridge and return by 4×4",
                "OPTION B · BIN EL OUIDANE": "OPTION B · BIN EL OUIDANE",
                "Par personne · Lac, bateau et déjeuner inclus": "Per person · Lake, boat and lunch included",
                "Demander une date pour l'expédition ↗": "Request an expedition date ↗",
                "La rivière en images.": "The river in pictures.",
                "Votre aventure en 4 étapes.": "Your adventure in 4 steps.",
                "Choisissez": "Choose",
                "Contactez-nous": "Contact us",
                "Préparez-vous": "Get ready",
                "Vivez l'Atlas": "Experience the Atlas",
                "Bon à savoir.": "Good to know.",
                "Vérifier une date": "Check a date",
                "Questions fréquentes": "Frequently asked questions"
              }
              english=html.replace('<html lang="fr"','<html lang="en"')
              # Translate only visible text nodes, preserving layout and HTML attributes.
              def translate_node(match):
                  value=match.group(1)
                  key=value.strip()
                  return '>'+value.replace(key,translations[key])+'<' if key in translations else match.group(0)
              english=re.sub(r'>([^<>]+)<',translate_node,english)
              (root/'rafting-content-en.html').write_text(english,encoding='utf-8')
              for lang in ('fr','en'):
                  f=root/lang/'rafting.html'
                  original=f.read_text(encoding='utf-8')
                  content_file='rafting-content-en.html' if lang=='en' else 'rafting-content.html'
                  embedded='''<main class="rafting-page" id="mainContent" style="padding:0;max-width:none">
          <iframe id="raftingExperienceFrame" title="Rafting Imsfrane" src="../RAFTING_CONTENT_FILE" loading="eager" scrolling="no" style="display:block;width:100%;height:2500px;border:0;overflow:hidden"></iframe>
          </main>
          <script>
          (function(){
            var frame=document.getElementById('raftingExperienceFrame');
            function resize(){try{var d=frame.contentDocument; if(d){frame.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}}catch(e){}}
            frame.addEventListener('load',function(){resize();setInterval(resize,900)});
            window.addEventListener('resize',resize);
          })();
          </script>'''
                  embedded=embedded.replace('RAFTING_CONTENT_FILE',content_file)
                  begin=original.find('<main')
                  opening_end=original.find('>',begin)+1
                  finish=original.find('</main>',opening_end)+len('</main>')
                  if begin < 0 or finish < len('</main>'):
                      raise RuntimeError('Cannot find original rafting main')
                  original=original[:begin]+embedded+original[finish:]
                  f.write_text(original,encoding='utf-8')
          (root/'.nojekyll').touch()
          PY
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
