name: Publish Imsfrane demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-demo.yml', 'rafting-v8.html', 'imsfrane_rafting_mobile_cadrage_corrige_v8*.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original site and prepare demo
        run: |
          git clone --depth 1 https://github.com/imsfraneinfo/imsfraneinfo.git /tmp/original
          mkdir -p public
          rsync -a --exclude=.git --exclude=.github --exclude=CNAME /tmp/original/ public/
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('public')
          for f in root.rglob('*.html'):
              s=f.read_text(encoding='utf-8')
              s=re.sub(r'(?i)(href|src|action|poster)=(["\'])/(?!/|Imsfrane-demo/)',r'\1=\2/Imsfrane-demo/',s)
              s=s.replace('https://imsfrane.com/fr/', '/Imsfrane-demo/fr/').replace('https://imsfrane.com/en/', '/Imsfrane-demo/en/')
              if f.as_posix() in ('public/fr/rafting.html','public/en/rafting.html'):
                  css="""<style id="imsfrane-demo-rafting-mobile">
          @media(max-width:650px){
          .hero-media,.hero-media .shot.main{height:320px!important;min-height:320px!important}
          .hero-media img,.route-visual img,.story-photos img,.gallery-grid img{width:100%!important;height:100%!important;object-fit:cover!important}
          .hero-media img{object-position:50% 85%!important}
          .route-visual{height:255px!important;overflow:hidden!important}
          .route-visual img{object-position:50% 80%!important}
          .gallery-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}
          }
          </style>"""
                  s=s.replace('</head>',css+'</head>',1)
              f.write_text(s,encoding='utf-8')
          # Preserve the original site header/menu/footer. Insert only V8 content.
          approved=next(iter(sorted(Path('.').glob('imsfrane_rafting_mobile_cadrage_corrige_v8*.html'))), Path('rafting-v8.html'))
          if approved.exists():
              html=approved.read_text(encoding='utf-8')
              hide='<style>.header,.concept-bar,.season-strip,.progress,footer,.footer{display:none!important}body{padding-top:0!important;margin:0!important}.hero{margin-top:0!important}</style>'
              html=html.replace('</head>',hide+'</head>',1)
              (root/'rafting-content.html').write_text(html,encoding='utf-8')
              translations={
                'Vivez':'Experience','rivière.':'the river.','Explorer les parcours':'Explore the routes','Voir les photos':'View photos',
                'Expériences':'Experiences','De rivière':'Of river','À partir de / pers.':'From / person',
                'Choisir son aventure':'Choose your adventure','Connaître la saison':'Check the season','Voir l’expérience':'See the experience',
                'Nos photos sur la rivière':'Our river photos','Demander une date':'Ask about a date','Réponse personnalisée':'Personalized reply',
                'De vrais rapides.':'Real rapids.','De vrais':'Real','souvenirs.':'memories.',
                'L\'aventure est ici.':'Adventure starts here.','Le bon moment,':'The right time,','la bonne rivière.':'the right river.',
                'Saison habituelle':'Typical season','Selon niveau d’eau':'Depending on water levels','Hors saison':'Off-season',
                'Choisissez l\'intensité.':'Choose your adventure level.','DÉCOUVERTE':'DISCOVERY','AVENTURE':'ADVENTURE',
                'EXPÉDITION':'EXPEDITION','à Tilouguite':'to Tilouguite','La grande':'The great','expédition':'expedition',
                'Que comprend la sortie ?':'What is included?','Rendez-vous au lieu convenu':'Meet at the agreed location',
                'Accompagné':'Guided','/ personne':'/ person','Prix du parcours':'Route price',
                'Choisir ce parcours':'Choose this route','Découvrir l\'expédition':'Explore the expedition',
                'Deux jours.':'Two days.','Mille souvenirs.':'A thousand memories.',
                'Voir les deux destinations':'See both destinations','Jour 01 — En route vers l\'aventure':'Day 01 — The adventure begins',
                'Jour 02 — Au cœur des gorges':'Day 02 — Into the gorges',
                'La rivière en images.':'The river in pictures.','Votre aventure en 4 étapes.':'Your adventure in 4 steps.',
                'Choisissez':'Choose','Contactez-nous':'Contact us','Préparez-vous':'Get ready',
                'Vivez l\'Atlas':'Experience the Atlas','Bon à savoir.':'Good to know.',
                'Prêt à rejoindre':'Ready to join','la rivière ?':'the river?',
                'Vérifier une date':'Check a date','Réserver':'Book now','Questions fréquentes':'Frequently asked questions',
                'SAISON HABITUELLE : MARS → JUIN':'TYPICAL SEASON: MARCH → JUNE',
                'HAUT ATLAS · OUED AHANSAL · MAROC':'HIGH ATLAS · OUED AHANSAL · MOROCCO',
                'EXPÉRIENCES AUTHENTIQUES':'AUTHENTIC EXPERIENCES','L\'AVENTURE, TOUT SIMPLEMENT':'ADVENTURE, PURE AND SIMPLE',
                'AVANT DE CHOISIR UNE DATE':'BEFORE CHOOSING A DATE','VOTRE RIVIÈRE, VOTRE RYTHME':'YOUR RIVER, YOUR PACE',
                'ÉMOTIONS SUR L’EAU':'THRILLS ON THE WATER','L\'EXPÉRIENCE SIGNATURE':'OUR SIGNATURE EXPERIENCE',
                'À partir de':'From','Mars à juin, selon débit':'March to June, depending on river flow',
                'PARCOURS 01 · OUED AHANSAL':'ROUTE 01 · OUED AHANSAL',
                'PARCOURS 02 · OUED MELLOUL':'ROUTE 02 · OUED MELLOUL',
                'PARCOURS 03 · 2 JOURS':'ROUTE 03 · 2 DAYS',
              }
              english=html.replace('<html lang="fr"','<html lang="en"')
              for source,target in translations.items():
                  english=english.replace('>'+source+'<','>'+target+'<')
              (root/'rafting-content-en.html').write_text(english,encoding='utf-8')
              for lang in ('fr','en'):
                  f=root/lang/'rafting.html'
                  original=f.read_text(encoding='utf-8')
                  content_file='rafting-content-en.html' if lang=='en' else 'rafting-content.html'
                  embedded='''<main class="rafting-page" id="mainContent" style="padding:0;max-width:none">
          <iframe id="raftingExperienceFrame" title="Rafting Imsfrane" src="../RAFTING_CONTENT_FILE" loading="eager" scrolling="no" style="display:block;width:100%;height:2500px;border:0;overflow:hidden"></iframe>
          </main>
          <script>
          (function(){
            var frame=document.getElementById('raftingExperienceFrame');
            function resize(){try{var d=frame.contentDocument; if(d){frame.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}}catch(e){}}
            frame.addEventListener('load',function(){resize();setInterval(resize,900)});
            window.addEventListener('resize',resize);
          })();
          </script>'''
                  embedded=embedded.replace('RAFTING_CONTENT_FILE',content_file)
                  begin=original.find('<main')
                  opening_end=original.find('>',begin)+1
                  finish=original.find('</main>',opening_end)+len('</main>')
                  if begin < 0 or finish < len('</main>'):
                      raise RuntimeError('Cannot find original rafting main')
                  original=original[:begin]+embedded+original[finish:]
                  f.write_text(original,encoding='utf-8')
          (root/'.nojekyll').touch()
          PY
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
