                "NOV": "NOV",
                "DÉC": "DEC",
                "Saison habituelle": "Typical season",
                "Selon niveau d’eau": "Depending on water levels",
                "Hors saison": "Off-season",
                "Ce calendrier est indicatif : aucun mois ne garantit un départ. Chaque demande est validée après vérification de la météo, du débit et des conditions de sécurité.": "This calendar is indicative: no month guarantees a departure. Each request is confirmed after checking weather, river flow and safety conditions.",
                "Choisissez l'intensité.": "Choose your level of adventure.",
                "Trois parcours pour découvrir les paysages de l'Atlas. Les itinéraires restent adaptés aux conditions réelles de la rivière.": "Three routes to discover the Atlas landscapes. Itineraries are adapted to actual river conditions.",
                "DÉCOUVERTE": "DISCOVERY",
