name: Publish Imsfrane demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-demo.yml', 'rafting-v8.html', 'imsfrane_rafting_mobile_cadrage_corrige_v8*.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original site and prepare demo
        run: |
          git clone --depth 1 https://github.com/imsfraneinfo/imsfraneinfo.git /tmp/original
          mkdir -p public
          rsync -a --exclude=.git --exclude=.github --exclude=CNAME /tmp/original/ public/
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('public')
          for f in root.rglob('*.html'):
              s=f.read_text(encoding='utf-8')
              s=re.sub(r'(?i)(href|src|action|poster)=(["\'])/(?!/|Imsfrane-demo/)',r'\1=\2/Imsfrane-demo/',s)
              s=s.replace('https://imsfrane.com/fr/', '/Imsfrane-demo/fr/').replace('https://imsfrane.com/en/', '/Imsfrane-demo/en/')
              if f.as_posix() in ('public/fr/rafting.html','public/en/rafting.html'):
                  css="""<style id="imsfrane-demo-rafting-mobile">
          @media(max-width:650px){
          .hero-media,.hero-media .shot.main{height:320px!important;min-height:320px!important}
          .hero-media img,.route-visual img,.story-photos img,.gallery-grid img{width:100%!important;height:100%!important;object-fit:cover!important}
          .hero-media img{object-position:50% 85%!important}
          .route-visual{height:255px!important;overflow:hidden!important}
          .route-visual img{object-position:50% 80%!important}
          .gallery-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}
          }
          </style>"""
                  s=s.replace('</head>',css+'</head>',1)
              f.write_text(s,encoding='utf-8')
          # Preserve the original site header/menu/footer. Insert only V8 content.
          approved=next(iter(sorted(Path('.').glob('imsfrane_rafting_mobile_cadrage_corrige_v8*.html'))), Path('rafting-v8.html'))
          if approved.exists():
              html=approved.read_text(encoding='utf-8')
              hide='<style>.header,.concept-bar,.season-strip,.progress,footer,.footer{display:none!important}body{padding-top:0!important;margin:0!important}.hero{margin-top:0!important}</style>'
              html=html.replace('</head>',hide+'</head>',1)
              (root/'rafting-content.html').write_text(html,encoding='utf-8')
              translations={
                "Vivez": "Experience",
                "la": "the",
                "rivière.": "river.",
                "De vrais rapides.": "Real rapids.",
                "De vrais": "Real",
                "souvenirs.": "memories.",
                "Et soudain,": "And suddenly,",
                "tout devient vivant.": "everything comes alive.",
                "Deux jours.": "Two days.",
                "Mille souvenirs.": "A thousand memories.",
                "Le bon moment,": "The right time,",
                "la bonne rivière.": "the right river.",
                "Prêt à rejoindre": "Ready to ride",
                "la rivière ?": "the river?",
                "L'Atlas côté rivière.": "The Atlas from the river.",
                "Choisir son aventure": "Choose your adventure",
                "Connaître la saison": "Check the season",
                "Voir l’expérience": "See the experience",
                "Nos photos sur la rivière": "Our river photos",
                "Demander une date": "Request a date",
                "Réponse personnalisée": "Personalized reply",
                "L'AVENTURE, TOUT SIMPLEMENT": "PURE ADVENTURE",
