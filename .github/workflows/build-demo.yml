name: Build Imsfrane demo
on:
  push:
    paths:
      - '.github/workflows/build-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy original website
        run: |
          git clone --depth 1 https://github.com/imsfraneinfo/imsfraneinfo.git /tmp/imsfrane-original
          cp -a /tmp/imsfrane-original/. ./
          rm -rf .git
          echo "This workflow requires a different deployment method" 
