name: Publish Imsfrane demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-demo.yml'
      - 'build_weekend_offers.py'
      - 'build_about_team.py'
      - 'build_visual_identity.py'
      - 'team-portraits/*.webp.b64'
      - 'build_bivouac_showcase.py'
      - 'build_rafting_50km_article.py'
      - 'build_vtt_programmes.py'
      - 'vtt-programmes.json'
      - 'build_international_seo.py'
      - 'build_legacy_redirects.py'
      - 'build_route_numbers.py'
      - 'build_adsense_readiness.py'
      - 'qa_adsense_readiness.py'
      - 'rafting-50km-article.json'
      - 'images/IMG_bivouac-*.webp'
  workflow_dispatch:
concurrency:
  group: imsfrane-demo-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the latest official website
        run: |
          git clone --depth 1 https://github.com/imsfraneinfo/imsfraneinfo.git /tmp/official
          mkdir -p public
          rsync -a --exclude=.git --exclude=.github --exclude=CNAME /tmp/official/ public/
      - name: Adapt demo hosting paths and verify the official mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          
          root = Path("public")
          prefix = "/Imsfrane-demo/"
          source_sha = subprocess.check_output(["git", "-C", "/tmp/official", "rev-parse", "HEAD"], text=True).strip()
          # Preserve the current official content and adapt only its hosting path.
          def adapt(text):
              text = re.sub(r"https://(?:www\.)?imsfrane\.com/", "https://imsfraneinfo.github.io/Imsfrane-demo/", text, flags=re.I)
              # Path guards must recognize the demo subdirectory as well.
              text = text.replace(r'/^\/(fr|en|ar|es)\//', r'/^\/(?:Imsfrane-demo\/)?(fr|en|ar|es)\//')
              text = text.replace('ims-favorites-demo.js?v=', 'ims-favorites-demo.js?demo=mirror-paths-v3&v=')
              protected = []
              def protect(match):
                  protected.append(match[0])
                  return "__IMS_PATH_SUFFIX_" + str(len(protected) - 1) + "__"
              text = re.sub(r"""(?:\[href\$=|\.endsWith\()(["'])/[^"']*\1""", protect, text)
              # Rewrite actual site-root paths, never suffix selectors or URL fragments.
              roots = [re.escape(p.name) + ("/" if p.is_dir() else r'''(?=[?\#"'<>\s]|$)''') for p in root.iterdir() if not p.name.startswith(".")]
              text = re.sub(r"""(["'])/(?=(?:""" + "|".join(roots) + r"""))""", lambda m: m[1] + prefix, text)
              # Dynamic localized links begin with a standalone slash plus the language.
              text = re.sub(r"""(["'])/\1(\s*\+\s*lang\b)""", lambda m: m[1] + prefix + m[1] + m[2], text)
              text = text.replace('href="/\'+lang+', 'href="/Imsfrane-demo/\'+lang+')
              text = re.sub(r"""(href|src|action)=(["'])/\2""", lambda m: m[1] + "=" + m[2] + prefix + m[2], text)
              text = re.sub(r"""url\((["']?)/(?!/|Imsfrane-demo/)""", lambda m: "url(" + m[1] + prefix, text)
              text = re.sub(r"""(?i)(content=["']\d+;\s*url=)/(?!/|Imsfrane-demo/)""", lambda m: m[1] + prefix, text)
              # Additional entries inside responsive srcset attributes.
              def srcset(match):
                  return re.sub(r"(?<!\S)/(?!/|Imsfrane-demo/)", prefix, match[0])
              text = re.sub(r"""srcset=(["']).*?\1""", srcset, text, flags=re.S)
              # Bust the previous navigation script cached by browsers and the CDN.
              text = re.sub(r"""(<script\b[^>]*\bsrc=["'][^"']*navigation-pro\.js)(\?[^"']*)?""", lambda m: m[1] + (m[2] + "&" if m[2] else "?") + "demo=mirror-paths-v3", text)
              # Public preview pages must not compete with the official site.
              if re.match(r'\s*(?:<!doctype html|<html)', text, re.I):
                  text = re.sub(r'<meta\b(?=[^>]*name=["\'](?:robots|googlebot)["\'])[^>]*>', '', text, flags=re.I)
                  text = text.replace('</head>', '<meta name="robots" content="noindex,follow">\n</head>', 1)
              for i, value in enumerate(protected):
                  text = text.replace("__IMS_PATH_SUFFIX_" + str(i) + "__", value)
              return text
          
          for path in root.rglob("*"):
              if path.is_file() and path.suffix.lower() in (".html", ".css", ".js", ".json", ".webmanifest", ".xml"):
                  path.write_text(adapt(path.read_text(encoding="utf-8")), encoding="utf-8")
          
          # The favorite loader checks the pathname before loading its buttons.
          navigation = root / "navigation-pro.js"
          if navigation.exists():
              text = navigation.read_text(encoding="utf-8")
              text = text.replace(
                  r'if(!/^\/(fr|en|ar|es)\//.test(location.pathname))return;',
                  r'if(!/^\/(?:Imsfrane-demo\/)?(fr|en|ar|es)\//.test(location.pathname))return;'
              )
              navigation.write_text(text, encoding="utf-8")
          
          # Check every copied text file against the official source after path adaptation.
          for original in Path("/tmp/official").rglob("*"):
              relative = original.relative_to("/tmp/official")
              if not original.is_file() or relative.parts[0] in (".git", ".github") or str(relative) == "CNAME":
                  continue
              target = root / relative
              assert target.is_file(), f"Missing official file: {relative}"
              if original.suffix.lower() in (".html", ".css", ".js", ".json", ".webmanifest", ".xml"):
                  expected = adapt(original.read_text(encoding="utf-8"))
                  if str(relative) == "navigation-pro.js":
                      expected = expected.replace(
                          r'if(!/^\/(fr|en|ar|es)\//.test(location.pathname))return;',
                          r'if(!/^\/(?:Imsfrane-demo\/)?(fr|en|ar|es)\//.test(location.pathname))return;'
                      )
                  assert target.read_text(encoding="utf-8") == expected, f"Content mismatch: {relative}"
              else:
                  assert target.read_bytes() == original.read_bytes(), f"Asset mismatch: {relative}"
          
          (root / ".nojekyll").touch()
          (root / "robots.txt").write_text("User-agent: *\nAllow: /\n", encoding="utf-8")
          (root / "demo-source.json").write_text(json.dumps({"official_commit": source_sha, "changes": ["exact official mirror with demo hosting paths and noindex"], "locales": ["fr", "en", "ar", "es"]}, indent=2), encoding="utf-8")
          print("Verified all official pages and assets. Official source:", source_sha)
          
          PY
      - name: Build demo weekend offers
        run: python3 build_weekend_offers.py
      - name: Build demo About team
        run: python3 build_about_team.py
      - name: Apply experimental Ahansal and Atlas visual identity
        run: python3 build_visual_identity.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages


