name: Publish Imsfrane demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-demo.yml', 'rafting-v8.html', 'imsfrane_rafting_mobile_cadrage_corrige_v8*.html', 'images/rafting-new/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original site and prepare demo
        run: |
          git clone --depth 1 https://github.com/imsfraneinfo/imsfraneinfo.git /tmp/original
          mkdir -p public
          rsync -a --exclude=.git --exclude=.github --exclude=CNAME /tmp/original/ public/
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('public')
          for f in root.rglob('*.html'):
              s=f.read_text(encoding='utf-8')
              s=re.sub(r'(?i)(href|src|action|poster)=(["\'])/(?!/|Imsfrane-demo/)',r'\1=\2/Imsfrane-demo/',s)
              s=s.replace('https://imsfrane.com/fr/', '/Imsfrane-demo/fr/').replace('https://imsfrane.com/en/', '/Imsfrane-demo/en/')
              if f.as_posix() in ('public/fr/rafting.html','public/en/rafting.html'):
                  css="""<style id="imsfrane-demo-rafting-mobile">
          @media(max-width:650px){
          .hero-media,.hero-media .shot.main{height:320px!important;min-height:320px!important}
          .hero-media img,.route-visual img,.story-photos img,.gallery-grid img{width:100%!important;height:100%!important;object-fit:cover!important}
          .hero-media img{object-position:50% 85%!important}
          .route-visual{height:255px!important;overflow:hidden!important}
          .route-visual img{object-position:50% 80%!important}
          .gallery-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}
          }
          </style>"""
                  s=s.replace('</head>',css+'</head>',1)
              f.write_text(s,encoding='utf-8')
          # Preserve the original site header/menu/footer. Insert only V8 content.
          approved=next(iter(sorted(Path('.').glob('imsfrane_rafting_mobile_cadrage_corrige_v8*.html'))), Path('rafting-v8.html'))
          if approved.exists():
              html=approved.read_text(encoding='utf-8')
              hide='<style>.header,.concept-bar,.season-strip,.progress,footer,.footer{display:none!important}body{padding-top:0!important;margin:0!important}.hero{margin-top:0!important}</style>'
              # Desktop-only image framing: fill the panels, keeping rafters and rapids in focus.
              desktop_css="""<style id="rafting-desktop-photo-framing">
              @media(min-width:871px){
                .route-visual{height:355px!important;overflow:hidden!important;background:#17353a!important}
                .route-visual.photo-safe{position:relative!important;isolation:auto!important}
                .route-visual.photo-safe::before{display:none!important}
                .route-visual>img,.route-visual.photo-safe>img{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;transform:none!important;z-index:0!important}
                .route-visual .corner,.route-visual .num,.route-visual .view-original{z-index:2!important}
                .route-card:nth-child(1) .route-visual>img{object-position:50% 76%!important}
                .route-card:nth-child(2) .route-visual>img{object-position:50% 76%!important}
                .route-card:nth-child(3) .route-visual>img{object-position:50% 76%!important}
                .hero-media,.hero-media .shot{overflow:hidden!important}
                .hero-media .shot img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:50% 72%!important}
                .story-photos .big img,.story-photos .little img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:50% 70%!important}
                .exp-photo img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:50% 72%!important}
                .gallery-grid img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:50% 70%!important}
              }
              </style>"""
              html=html.replace('</head>',hide+desktop_css+'</head>',1)
              # Use the new rafting photo collection whenever uploaded to this demo repo.
              # Keep existing live-site photos as a fallback until the collection is present.
              new_photos=Path('images')
              if new_photos.is_dir():
                  import shutil
                  target=root/'images/rafting-new'
                  target.mkdir(parents=True,exist_ok=True)
                  for photo in new_photos.glob('*.webp'):
                      shutil.copy2(photo,target/photo.name)
                  image_sequence=[
                      'IMG_9296.webp','IMG_0296.webp','IMG_2012.webp',
                      'IMG_9129.webp','IMG_2089.webp','IMG_1893.webp',
                      'IMG_2101.webp','IMG_6626.webp','IMG_7076.webp',
                      'IMG_7886.webp','IMG_9066.webp','IMG_1880.webp',
                      'IMG_0305.webp','IMG_2060.webp'
                  ]
                  image_tags=list(re.finditer(r'<img\b[^>]*>',html))
                  # Replace image URLs in each actual img tag (regardless of attribute order).
                  image_tags=[m for m in image_tags if re.search(r'src="https://imsfrane.com/images/[^"]+"',m.group(0))]
                  for i,m in reversed(list(enumerate(image_tags))):
                      name=image_sequence[i % len(image_sequence)]
                      if not (new_photos/name).is_file():
                          continue
                      tag=m.group(0)
                      tag=re.sub(r'src="https://imsfrane.com/images/[^"]+"',
                                 'src="images/rafting-new/'+name+'"',tag,count=1)
                      html=html[:m.start()]+tag+html[m.end():]
              # Complete the photo gallery with all fourteen unique uploaded images.
              if new_photos.is_dir():
                  gallery_start=html.find('id="gallery"')
                  gallery_end=html.find('</div>',gallery_start)
                  if gallery_start!=-1 and gallery_end!=-1:
                      gallery_html=html[gallery_start:gallery_end]
                      # Replace the eight gallery slots with eight unique photos.
                      gallery_names=['IMG_7886.webp','IMG_9066.webp','IMG_1880.webp','IMG_0305.webp','IMG_2060.webp','IMG_7076.webp','IMG_6626.webp','IMG_2101.webp']
                      for j,match in reversed(list(enumerate(re.finditer(r'<img\\b[^>]*>',gallery_html)))):
                          if j>=len(gallery_names):continue
                          name=gallery_names[j]
                          tag=re.sub(r'src="[^"]+"','src="images/rafting-new/'+name+'"',match.group(0))
                          gallery_html=gallery_html[:match.start()]+tag+gallery_html[match.end():]
                      extra_names=['IMG_9296.webp','IMG_0296.webp','IMG_2012.webp','IMG_9129.webp','IMG_2089.webp','IMG_1893.webp','IMG_9066.webp']
                      extra=''.join('<button aria-label="Agrandir la photo de rafting '+str(9+j)+'" data-image="'+str(8+j)+'" type="button"><img alt="Rafting Imsfrane — photo '+str(9+j)+'" loading="lazy" src="images/rafting-new/'+name+'"/></button>' for j,name in enumerate(extra_names))
                      html=html[:gallery_start]+gallery_html+extra+html[gallery_end:]
              (root/'rafting-content.html').write_text(html,encoding='utf-8')
