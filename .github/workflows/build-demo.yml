name: Publish Imsfrane demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-demo.yml'
      - 'build_bivouac_showcase.py'
      - 'build_rafting_50km_article.py'
      - 'build_vtt_programmes.py'
      - 'vtt-programmes.json'
      - 'build_international_seo.py'
      - 'build_legacy_redirects.py'
      - 'rafting-50km-article.json'
      - 'images/IMG_bivouac-*.webp'
  workflow_dispatch:
concurrency:
  group: imsfrane-demo-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the latest official website
        run: |
          git clone --depth 1 https://github.com/imsfraneinfo/imsfraneinfo.git /tmp/official
          mkdir -p public
          rsync -a --exclude=.git --exclude=.github --exclude=CNAME /tmp/official/ public/
      - name: Adapt demo paths and add the bivouac photographs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil
          import subprocess
          from build_bivouac_showcase import patch_page
          
          root = Path("public")
          prefix = "/Imsfrane-demo/"
          source_sha = subprocess.check_output(["git", "-C", "/tmp/official", "rev-parse", "HEAD"], text=True).strip()
          from build_rafting_50km_article import build as build_article
          build_article(root)
          from build_vtt_programmes import build as build_vtt
          build_vtt(root)
          from build_international_seo import build as build_international_seo
          build_international_seo(root)
          from build_legacy_redirects import build as build_legacy_redirects
          build_legacy_redirects(root)
          
          # Preserve the current official content and adapt only its hosting path.
          def adapt(text):
              text = re.sub(r"https://(?:www\.)?imsfrane\.com/", "https://imsfraneinfo.github.io/Imsfrane-demo/", text, flags=re.I)
              text = re.sub(r"""(["'])/(?!/|Imsfrane-demo/|["'])""", lambda m: m[1] + prefix, text)
              text = re.sub(r"""(href|src|action)=(["'])/\2""", lambda m: m[1] + "=" + m[2] + prefix + m[2], text)
              text = re.sub(r"""url\((["']?)/(?!/|Imsfrane-demo/)""", lambda m: "url(" + m[1] + prefix, text)
              text = re.sub(r"""(?i)(content=["']\d+;\s*url=)/(?!/|Imsfrane-demo/)""", lambda m: m[1] + prefix, text)
              # Additional entries inside responsive srcset attributes.
              def srcset(match):
                  return re.sub(r"(?<!\S)/(?!/|Imsfrane-demo/)", prefix, match[0])
              text = re.sub(r"""srcset=(["']).*?\1""", srcset, text, flags=re.S)
              # Public preview pages must not compete with the official site.
              if re.match(r'\s*(?:<!doctype html|<html)', text, re.I):
                  text = re.sub(r'<meta\b(?=[^>]*name=["\'](?:robots|googlebot)["\'])[^>]*>', '', text, flags=re.I)
                  text = text.replace('</head>', '<meta name="robots" content="noindex,follow">\n</head>', 1)
              return text
          
          for path in root.rglob("*"):
              if path.is_file() and path.suffix.lower() in (".html", ".css", ".js", ".json", ".webmanifest", ".xml"):
                  path.write_text(adapt(path.read_text(encoding="utf-8")), encoding="utf-8")
          
          # The favorite loader checks the pathname before loading its buttons.
          navigation = root / "navigation-pro.js"
          if navigation.exists():
              text = navigation.read_text(encoding="utf-8")
              text = text.replace(
                  r'if(!/^\/(fr|en|ar|es)\//.test(location.pathname))return;',
                  r'if(!/^\/(?:Imsfrane-demo\/)?(fr|en|ar|es)\//.test(location.pathname))return;'
              )
              navigation.write_text(text, encoding="utf-8")
          
          photos = sorted(Path("images").glob("IMG_bivouac-*.webp"))
          assert len(photos) == 4, "Expected the four real bivouac photographs"
          for photo in photos:
              shutil.copy2(photo, root / "images" / photo.name)
          
          pages = []
          for lang in ("fr", "en", "ar", "es"):
              kayak = root / lang / "kayak" / "index.html"
              assert kayak.is_file(), f"Missing current official kayak page: {kayak}"
              patch_page(kayak, lang, "kayak", '<section class="ky-section ky-gallery-section"')
              pages.append(kayak)
              suffix = "" if lang == "fr" else "-" + lang
              rafting = root / ("rafting-content" + suffix + ".html")
              patch_page(rafting, lang, "rafting", '<section aria-labelledby="gallery-title"')
              pages.append(rafting)
          
          for page in pages:
              text = page.read_text(encoding="utf-8")
              assert text.count('id="bivouac-experience"') == 1, f"Duplicate or missing story: {page}"
              assert all("/Imsfrane-demo/images/" + photo.name in text for photo in photos), f"Missing photographs: {page}"
          for lang in ("fr", "en", "ar", "es"):
              original = Path("/tmp/official") / lang / "index.html"
              assert (root / lang / "index.html").read_text(encoding="utf-8") == adapt(original.read_text(encoding="utf-8")), f"Homepage changed unexpectedly: {lang}"
          
          (root / ".nojekyll").touch()
          (root / "robots.txt").write_text("User-agent: *\nAllow: /\n", encoding="utf-8")
          (root / "demo-source.json").write_text(json.dumps({"official_commit": source_sha, "changes": ["kayak and rafting bivouac photographs"], "locales": ["fr", "en", "ar", "es"]}, indent=2), encoding="utf-8")
          print("Verified current official homepages and 8 bivouac experiences. Official source:", source_sha)
          
          PY
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

